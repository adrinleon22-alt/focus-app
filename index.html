<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the phone screen instead of showing a zoomed-out desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tells the browser this page supports both light and dark mode -->
  <meta name="color-scheme" content="light dark">
  <title>Study Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Screen 1: Home. Type a task and start. -->
  <main id="home-screen" class="screen">
    <h1>Study Tracker</h1>

    <!-- Today's total. Tapping it opens the Today screen. -->
    <button id="today-link" class="today-link" type="button">
      Today: <strong id="home-today-total">0:00:00</strong> ›
    </button>

    <!-- Shown briefly after Stop, e.g. "Saved: Statistik Blatt 3 – 0:42:10" -->
    <p id="saved-message" class="saved-message" hidden></p>

    <label for="task-input">What are you working on?</label>
    <input id="task-input" type="text" placeholder="e.g. Statistik Blatt 3" autocomplete="off">

    <label for="subject-input">Subject (optional)</label>
    <input id="subject-input" type="text" placeholder="e.g. Statistik" autocomplete="off">

    <!-- Buttons for recent tasks get added here by app.js -->
    <div id="recent-tasks" class="recent-tasks"></div>

    <button id="start-btn" class="big-btn primary">Start</button>

    <!-- Small link at the very bottom, out of the way of Start -->
    <button id="history-link" class="link-btn bottom-link" type="button">History ›</button>
  </main>

  <!-- Screen 4: History. All days, newest first. -->
  <main id="history-screen" class="screen" hidden>
    <button id="history-back" class="link-btn" type="button">‹ Back</button>
    <h1>History</h1>
    <p id="history-empty" class="muted" hidden>No sessions yet.</p>
    <!-- One block per day gets added here by app.js -->
    <div id="history-list"></div>

    <!-- Backup: save all data to a file, or load it back from one -->
    <section class="backup">
      <h2>Backup</h2>
      <button id="export-btn" class="big-btn" type="button">Export backup</button>
      <button id="import-btn" class="big-btn" type="button">Import backup</button>
      <!-- The real file picker is invisible; the Import button opens it -->
      <input id="import-file" type="file" accept=".json,application/json" hidden>
      <p id="backup-message" class="muted" hidden></p>
    </section>
  </main>

  <!-- Screen 5: One day's sessions, one by one -->
  <main id="day-screen" class="screen" hidden>
    <button id="day-back" class="link-btn" type="button">‹ Back</button>
    <h1 id="day-title"></h1>
    <p id="day-total" class="today-total">0:00:00</p>
    <!-- One row per session gets added here by app.js -->
    <ul id="day-list" class="task-list"></ul>
  </main>

  <!-- Screen 3: Today. Total plus time per task. -->
  <main id="today-screen" class="screen" hidden>
    <button id="today-back" class="link-btn" type="button">‹ Back</button>
    <h1>Today</h1>
    <p id="today-total" class="today-total">0:00:00</p>
    <p id="today-empty" class="muted" hidden>Nothing tracked today yet.</p>
    <!-- One row per task gets added here by app.js -->
    <ul id="today-list" class="task-list"></ul>
  </main>

  <!-- Screen 6: Edit one saved session -->
  <main id="edit-screen" class="screen" hidden>
    <button id="edit-cancel" class="link-btn" type="button">‹ Cancel</button>
    <h1>Edit session</h1>

    <label for="edit-task">Task</label>
    <input id="edit-task" type="text" autocomplete="off">

    <label for="edit-subject">Subject (optional)</label>
    <input id="edit-subject" type="text" autocomplete="off">

    <!-- datetime-local opens the phone's own date + time picker -->
    <label for="edit-start">Start</label>
    <input id="edit-start" type="datetime-local">

    <label for="edit-end">End</label>
    <input id="edit-end" type="datetime-local">

    <label for="edit-paused">Paused (minutes)</label>
    <input id="edit-paused" type="number" min="0" step="1" inputmode="numeric">

    <!-- Live preview of the work time, e.g. "Duration: 0:45:00" -->
    <p id="edit-duration" class="muted"></p>
    <!-- Red message when something is wrong, e.g. end before start -->
    <p id="edit-error" class="error" hidden></p>

    <button id="edit-save" class="big-btn primary" type="button">Save</button>
    <button id="edit-delete" class="big-btn danger" type="button">Delete</button>
  </main>

  <!-- Screen 2: Running timer. "hidden" means it is not shown until JavaScript shows it. -->
  <main id="timer-screen" class="screen timer" hidden>
    <p id="timer-task" class="timer-task"></p>
    <p id="timer-display" class="timer-display">0:00:00</p>
    <p id="timer-status" class="timer-status"></p>
    <div class="timer-buttons">
      <button id="pause-btn" class="big-btn">Pause</button>
      <button id="stop-btn" class="big-btn danger">Stop</button>
    </div>
  </main>

  <!-- "defer" = run the script after the page has loaded -->
  <script src="app.js" defer></script>
</body>
</html>
