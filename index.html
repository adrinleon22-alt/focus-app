<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the phone screen instead of showing a zoomed-out desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tells the browser this page supports both light and dark mode -->
  <meta name="color-scheme" content="light dark">
  <title>Study Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Screen 1: Home. Type a task and start. -->
  <main id="home-screen" class="screen">
    <h1>Study Tracker</h1>
    <label for="task-input">What are you working on?</label>
    <input id="task-input" type="text" placeholder="e.g. Statistik Blatt 3" autocomplete="off">
    <button id="start-btn" class="big-btn primary">Start</button>
  </main>

  <!-- Screen 2: Running timer. "hidden" means it is not shown until JavaScript shows it. -->
  <main id="timer-screen" class="screen timer" hidden>
    <p id="timer-task" class="timer-task"></p>
    <p id="timer-display" class="timer-display">0:00:00</p>
    <p id="timer-status" class="timer-status"></p>
    <div class="timer-buttons">
      <button id="pause-btn" class="big-btn">Pause</button>
      <button id="stop-btn" class="big-btn danger">Stop</button>
    </div>
  </main>

  <!-- "defer" = run the script after the page has loaded -->
  <script src="app.js" defer></script>
</body>
</html>
